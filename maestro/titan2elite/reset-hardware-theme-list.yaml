appId: app.numen.keyboard
name: Reset hardware theme list
---
- scrollUntilVisible:
    element:
      text: "Choose a preset"
    direction: DOWN
    timeout: 20000
- repeat:
    times: 16
    commands:
      - swipe:
          start: 15%, 40%
          end: 90%, 40%
          duration: 250
- assertVisible:
    text: "Pastiera Dark"
