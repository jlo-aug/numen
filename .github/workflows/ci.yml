name: Numen CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # Numen is the "nightly" flavor; this includes the typo benchmark and chat simulation.
      - name: Run Numen unit tests
        run: ./gradlew :app:testNightlyDebugUnitTest
